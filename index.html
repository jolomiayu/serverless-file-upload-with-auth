<!DOCTYPE html>
<html>
<head>
  <title>Secure File Upload</title>
</head>
<body>

  <h2>🚀 Secure File Upload (AWS)</h2>

  <label>JWT Token:</label><br>
  <textarea id="token" rows="4" cols="60"></textarea><br><br>

  <input type="file" id="fileInput"><br><br>

  <button onclick="uploadFile()">Upload File</button>

  <p id="status"></p>

  <script>
    const API_URL = "https://nb0w7reol0.execute-api.eu-west-1.amazonaws.com/Prod";

    async function uploadFile() {
      try {
        const token = document.getElementById("token").value;
        const file = document.getElementById("fileInput").files[0];

        if (!file) {
          alert("Please select a file");
          return;
        }

        document.getElementById("status").innerText = "Getting upload URL...";

        // Step 1: Get presigned URL
        const response = await fetch(API_URL + "/upload-url", {
          method: "GET",
          headers: {
            "Authorization": token
          }
        });

        if (!response.ok) {
          throw new Error("Failed to get upload URL");
        }

        const data = await response.json();

        document.getElementById("status").innerText = "Uploading file...";

        // Step 2: Upload file (MATCHES Lambda)
        const uploadResponse = await fetch(data.uploadUrl, {
          method: "PUT",
          headers: {
            "Content-Type": "application/octet-stream"
          },
          body: file
        });

        if (!uploadResponse.ok) {
          throw new Error("Upload failed");
        }

        document.getElementById("status").innerText =
          "✅ Upload successful! File: " + data.fileName;

      } catch (err) {
        console.error(err);
        document.getElementById("status").innerText =
          "❌ Error: " + err.message;
      }
    }
  </script>

</body>
</html>
