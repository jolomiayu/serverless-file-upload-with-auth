AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Serverless File Upload System with Cognito Authentication

Resources:

  UploadBucket:
    Type: AWS::S3::Bucket

  # ✅ Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: UploadUserPool
      AutoVerifiedAttributes:
        - email

  # ✅ Cognito App Client
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: UploadClient
      UserPoolId: !Ref UserPool
      GenerateSecret: false

  # ✅ API Gateway (CORS + Cognito FIXED)
  ServerlessApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false   # 🔥 CRITICAL FIX
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # ✅ Lambda Function
  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      Runtime: python3.9
      CodeUri: hello_world/

      Policies:
        - S3CrudPolicy:
            BucketName: !Ref UploadBucket

      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadBucket

      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref ServerlessApi
            Path: /upload-url
            Method: get
